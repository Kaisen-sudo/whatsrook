name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0 or latest)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-musl-amd64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-musl-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-amd64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          CRATES=("weather" "urban" "shorturl" "calc" "fact" "quotes" "joke" "rizz" "btc" "markets" "news" "wabeta" "why")
          
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXE_EXT=".exe"
          else
            EXE_EXT=""
          fi

          # Copy and rename individual binaries
          for crate in "${CRATES[@]}"; do
            src="target/${{ matrix.target }}/release/${crate}${EXE_EXT}"
            dest="dist/${crate}-${{ matrix.name }}${EXE_EXT}"
            cp "$src" "$dest"
          done

          # Create comprehensive archive bundle
          BUNDLE_DIR="whatsrook-externals-${{ matrix.name }}"
          mkdir -p "$BUNDLE_DIR"
          for crate in "${CRATES[@]}"; do
            cp "target/${{ matrix.target }}/release/${crate}${EXE_EXT}" "$BUNDLE_DIR/"
          done
          cp LICENSE README.md "$BUNDLE_DIR/"

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a "dist/whatsrook-externals-${{ matrix.name }}.zip" "$BUNDLE_DIR"
          else
            tar -czvf "dist/whatsrook-externals-${{ matrix.name }}.tar.gz" "$BUNDLE_DIR"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=v0.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
