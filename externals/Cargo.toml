[workspace]
members = [
    "crates/weather",
    "crates/urban",
    "crates/shorturl",
    "crates/calc",
    "crates/fact",
    "crates/quotes",
    "crates/joke",
    "crates/rizz",
    "crates/btc",
    "crates/markets",
    "crates/news",
    "crates/wabeta",
    "crates/why",
    "crates/ss",
    "crates/tts",
    "crates/qrcode",
    "crates/fancy",
    "crates/font",
    "crates/fonts",
    "crates/git",
    "crates/mp4url",
    "crates/cpu",
    "crates/memory",
    "crates/captcha",
    "crates/sticker",
    "crates/circle",
    "crates/crop",
    "crates/take",
    "crates/media",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Thruqe"]
license = "MIT"
repository = "https://github.com/Thruqe/whatsrook-externals"
keywords = ["whatsrook", "plugins", "whatsapp", "bot", "cli"]

[workspace.dependencies]
# Published SDK — use the crates.io release instead of the old local path.
whatsrook-sdk = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
