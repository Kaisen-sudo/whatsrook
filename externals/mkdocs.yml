site_name: WhatsRook External Plugins
site_description: Official suite of standalone external plugins and SDK for WhatsRook
site_author: Thruqe
site_url: https://thruqe.github.io/whatsrook-externals/
repo_url: https://github.com/thruqe/whatsrook-externals
repo_name: thruqe/whatsrook-externals
copyright: "Copyright &copy; 2026 Thruqe &bull; Built for the WhatsRook Ecosystem"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - search.suggest
    - search.highlight
    - search.share
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Overview: index.md
  - Installation & Setup: installation.md
  - Architecture & Protocol: protocol.md
  - Plugin Catalog: plugins.md
  - SDK & Development: sdk.md
  - Troubleshooting & FAQ: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thruqe/whatsrook-externals
      name: GitHub Repository
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/whatsrook-sdk
      name: whatsrook-sdk on crates.io
