# Configuration for PR path-based labeling (actions/labeler)
build:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'Taskfile.yml'
          - 'go.mod'
          - 'go.sum'
          - 'scripts/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/**'
          - '*.md'
          - 'LICENSE'

area:core:
  - changed-files:
      - any-glob-to-any-file:
          - '*.go'
          - 'pkg/wacore/**'

area:cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'

area:plugins:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/plugins/**'
          - 'pkg/externals/**'

area:voip:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/wacore/mlow/**'
          - 'pkg/wacore/rtp/**'
          - 'pkg/wacore/srtp/**'
          - 'pkg/wacore/stun/**'
          - 'pkg/wacore/call*.go'

area:utils:
  - changed-files:
      - any-glob-to-any-file:
          - 'util/**'
          - 'cmd/utils/**'

area:sdk:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/sdk/**'

area:web:
  - changed-files:
      - any-glob-to-any-file:
          - 'pkg/web/**'
