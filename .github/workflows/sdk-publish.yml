name: SDK Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0) — leave blank to release the current Cargo.toml version"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release v${{ inputs.version || '(current)' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: pkg/sdk

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pkg/sdk/target
          key: ${{ runner.os }}-cargo-sdk-release-${{ hashFiles('pkg/sdk/**/Cargo.lock', 'pkg/sdk/**/Cargo.toml') }}

      - name: Bump version in Cargo.toml
        if: ${{ inputs.version != '' }}
        run: sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" Cargo.toml

      - name: Resolve release version
        id: ver
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check
        run: cargo check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Verify package
        run: cargo package --list

      - name: Commit version bump
        if: ${{ inputs.version != '' }}
        run: |
          git config user.email "thruqe@gmail.com"
          git config user.name "Thruqe"
          git add Cargo.toml
          git diff --cached --quiet || git commit -m "chore(sdk): release v${{ steps.ver.outputs.version }}"
          git push origin HEAD:master || true

      - name: Create and push tag
        run: |
          git config user.email "thruqe@gmail.com"
          git config user.name "Thruqe"
          TAG="sdk-v${{ steps.ver.outputs.version }}"
          git tag "$TAG" 2>/dev/null \
            || echo "Tag $TAG already exists — skipping."
          git push origin "$TAG" 2>/dev/null \
            || echo "Tag already on remote — skipping push."

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.SDK_KEY || secrets.CARGO_REGISTRY_TOKEN }}
