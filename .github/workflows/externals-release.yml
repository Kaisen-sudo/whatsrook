name: Externals Release

on:
  push:
    branches:
      - master
    paths:
      - "pkg/externals/**"
    tags:
      - "externals-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (leave blank to target latest release or plugins)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: linux-amd64
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: linux-arm64
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-amd64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
            cross: false

    defaults:
      run:
        working-directory: pkg/externals

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross tool
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --workspace --target ${{ matrix.target }}
          else
            cargo build --release --workspace --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          CRATES=("btc" "calc" "captcha" "circle" "cpu" "crop" "fact" "fancy" "font" "fonts" "git" "joke" "markets" "media" "memory" "mp4url" "news" "qrcode" "quotes" "rizz" "shorturl" "ss" "sticker" "take" "tts" "urban" "wabeta" "weather" "why")
          
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXE_EXT=".exe"
          else
            EXE_EXT=""
          fi

          # Copy and rename individual binaries
          for crate in "${CRATES[@]}"; do
            src="target/${{ matrix.target }}/release/${crate}${EXE_EXT}"
            dest="dist/${crate}-${{ matrix.name }}${EXE_EXT}"
            cp "$src" "$dest"
          done

          # Create comprehensive archive bundle
          BUNDLE_DIR="whatsrook-externals-${{ matrix.name }}"
          mkdir -p "$BUNDLE_DIR"
          for crate in "${CRATES[@]}"; do
            cp "target/${{ matrix.target }}/release/${crate}${EXE_EXT}" "$BUNDLE_DIR/"
          done
          cp LICENSE README.md "$BUNDLE_DIR/"

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a "dist/whatsrook-externals-${{ matrix.name }}.zip" "$BUNDLE_DIR"
          else
            tar -czvf "dist/whatsrook-externals-${{ matrix.name }}.tar.gz" "$BUNDLE_DIR"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: pkg/externals/dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine tag name and target release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            # Try finding the latest release on the repository
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              TAG="plugins"
            fi
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish / Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GIT_TOKEN || secrets.RELEASE_PAT || secrets.PAT || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Targeting release tag: $TAG"
          # If target release exists, upload assets to it
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading release assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Release $TAG does not exist. Creating new release..."
            gh release create "$TAG" release-assets/* \
              --title "WhatsRook External Plugins ($TAG)" \
              --notes "Automated external plugin release build from commit \`${{ github.sha }}\` on $(date -u +'%Y-%m-%d %H:%M:%S UTC')." \
              --latest \
              --target "${{ github.sha }}"
          fi

          # Also mirror assets to a dedicated 'plugins' tag for guaranteed persistent resolution
          if [ "$TAG" != "plugins" ]; then
            echo "Mirroring assets to persistent 'plugins' release..."
            if gh release view "plugins" >/dev/null 2>&1; then
              gh release upload "plugins" release-assets/* --clobber
            else
              gh release create "plugins" release-assets/* \
                --title "WhatsRook External Plugins (Persistent Registry)" \
                --notes "Official persistent release registry for external plugins." \
                --target "${{ github.sha }}" || true
            fi
          fi
